<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 126" role="img" aria-labelledby="title desc">
  <title id="title">UUKDO Finder window header with language battery</title>
  <desc id="desc">A compact macOS Finder-inspired toolbar with a wide horizontal language battery, small language details, and a focused search field reading Welcome to UUKDO.</desc>
  <style>
    :root {
      --chrome: #f2f2f4;
      --toolbar: #fafafa;
      --border: #d0d0d3;
      --input: #ffffff;
      --track: #e5e7eb;
      --text: #202124;
      --muted: #6e6e73;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --chrome: #2b2b2d;
        --toolbar: #232325;
        --border: #444448;
        --input: #37373a;
        --track: #161b22;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #76f7ef;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: var(--text); }
    .detail { font-size: 12px; fill: var(--muted); }
  </style>

  <defs>
    <clipPath id="toolbar-battery-clip">
      <rect x="31" y="77" width="196" height="20" rx="5" />
    </clipPath>
    <linearGradient id="toolbar-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28" />
      <stop offset=".48" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <path d="M18 0h964a18 18 0 0 1 18 18v108H0V18A18 18 0 0 1 18 0z" fill="var(--chrome)" />
  <path d="M0 54h1000v72H0z" fill="var(--toolbar)" />
  <path d="M0 54h1000M0 125h1000" stroke="var(--border)" />

  <circle cx="28" cy="27" r="8" fill="#ff5f57" />
  <circle cx="52" cy="27" r="8" fill="#febc2e" />
  <circle cx="76" cy="27" r="8" fill="#28c840" />
  <text x="500" y="34" text-anchor="middle" font-size="17" font-weight="600">UUKDO</text>

  <!-- Horizontal language battery -->
  <rect x="24" y="70" width="210" height="34" rx="9" fill="var(--track)" stroke="var(--muted)" stroke-width="4" />
  <rect x="238" y="79" width="11" height="16" rx="3" fill="var(--muted)" />
  <g clip-path="url(#toolbar-battery-clip)">
    <rect x="31" y="77" width="124.50" height="20" fill="#f1e05a" />
    <rect x="155.50" y="77" width="45.45" height="20" fill="#563d7c" />
    <rect x="200.95" y="77" width="19.74" height="20" fill="#e34c26" />
    <rect x="220.69" y="77" width="6.31" height="20" fill="#336790" />
    <rect x="31" y="77" width="196" height="20" fill="url(#toolbar-shine)" />
  </g>

  <!-- Compact language status -->
  <rect x="270" y="70" width="10" height="10" rx="2" fill="#f1e05a" />
  <text class="detail" x="286" y="79">JavaScript 63.52%</text>
  <rect x="466" y="70" width="10" height="10" rx="2" fill="#563d7c" />
  <text class="detail" x="482" y="79">CSS 23.19%</text>
  <rect x="270" y="94" width="10" height="10" rx="2" fill="#e34c26" />
  <text class="detail" x="286" y="103">HTML 10.07%</text>
  <rect x="466" y="94" width="10" height="10" rx="2" fill="#336790" />
  <text class="detail" x="482" y="103">PLpgSQL 3.23%</text>

  <!-- Focused search field -->
  <rect x="746" y="70" width="232" height="34" rx="10" fill="var(--input)" stroke="var(--accent)" stroke-width="2" />
  <circle cx="765" cy="86" r="6" fill="none" stroke="var(--text)" stroke-width="2" />
  <path d="m770 91 5 5" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
  <text x="784" y="93" font-size="15">Welcome to UUKDO</text>
  <path d="M922 79v16" stroke="var(--accent)" stroke-width="2">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite" />
  </path>
</svg>
