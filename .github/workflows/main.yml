name: Profile snake

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 한국 오전 9시 == 매일 00:00 UTC
  workflow_dispatch:         # 수동 실행

# output 브랜치로 푸시하려면 repo 컨텐츠 쓰기 권한 필요
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 저장소 체크아웃
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 리베이스 하기 위해 전체 히스토리 필요

      # dist 폴더 미리 생성 (중요!)
      - name: Prepare dist folder
        run: mkdir -p dist

      # 뱀 생성 
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: uukdo
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif

      # 상태 확인
      - name: Git status
        run: git status

      # 생성물 확인
      - name: List dist
        run: ls -alh dist || true

      # dist/ 를 output 브랜치로 배포
      - name: Deploy profile assets to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
