name: Update language battery

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_language_stats.py"
      - "tests/test_update_language_stats.py"
      - ".github/workflows/update-language-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-language-battery
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Test language statistics
        run: python3 -m unittest discover -s tests -v

      - name: Generate language battery
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PROFILE_DISPLAY_NAME: UUKDO
          # A PAT expands access to private/org repositories; the built-in token
          # is enough for public repositories when GH_STATS_TOKEN is not set.
          STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          COMMIT_WINDOW_DAYS: "365"
        run: python3 scripts/update_language_stats.py

      - name: Commit updated graphic
        run: |
          if git diff --quiet -- assets/finder-toolbar.svg; then
            echo "Language data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/finder-toolbar.svg
          git commit -m "chore: update language battery"
          git push
